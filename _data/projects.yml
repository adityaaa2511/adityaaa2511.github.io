- title: Cross-lingual Relation Extraction with Multilingual LLMs
  image:
    src: /assets/img/project/nlp_llm.png
    alt: 
  date: March 2026
  description: Built a LoRA-tuned Qwen2.5-1.5B relation classifier for 5 languages. Used a staged curriculum of language-adaptive pretraining on unlabelled Indic corpora followed by task tuning on upsampled Indic data. Reframed generative extraction as label-ID prediction under greedy decoding to eliminate hallucinated labels, trained with interleaved LM and task loss to gain coverage of all four Indian languages. Designed a training-free in-context learning pipeline on Llama-3.1-8B using a two-block prompt with a byte-identical ontology prefix for vLLM prefix caching.
