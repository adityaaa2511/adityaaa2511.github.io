- title: Constrained Policy Optimization for Safe RL  
  image:
    src: /assets/img/project/bubbleshooter.png
    alt: 
  date: April 2026
  description: Coded PPO-Lagrangian from scratch for constrained MDPs, using dual reward and cost critics with separate GAE estimators, and supporting three actor objectives (standard Lagrangian, augmented Lagrangian with an adaptive quadratic penalty, and P3O clipped penalty) alongside two Lagrange multiplier update rules. Ran a 36-run sweep across every objective and rule combination on SafetyHopperVelocity and SafetyHalfCheetahVelocity for 1M timesteps and 3 seeds, identifying objective-2 & rule-2 as the best safety versus return trade-off
