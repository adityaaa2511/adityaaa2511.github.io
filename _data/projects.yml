- title: Multilingual Chain-of-Thought Distillation
  image:
    src: /assets/img/project/jpeg.png
    alt: 
  date: April 2026
  description: Distilled CoT reasoning from Qwen2.5-7B into Qwen2.5-1.5B and Llama-3.2-1B students across 5 languages. Countered Indic token fertility with English-pivot self-consistency (k=4) + target-language rendering; raised usable Tamil/Kannada trace yield by 20\% via STaR-style gold-conditioned rationalization. Eliminated an 9× gradient skew towards Indic scripts with per-example length normalization and added script-adaptation pretraining to reduce byte-fallback corruption.
