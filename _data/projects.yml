  date: October 2025
  description: Implemented a retrieve-and-rerank information retrieval pipeline on the TREC DL Hard dataset using BM25 and transformer-based cross-encoders including BERT, MiniLM, ELECTRA, and monoT5. Conducted a systematic comparison across NDCG@1/5/10 and MRR@10, analyzing the impact of retrieval depth and model size; ELECTRA achieved the best baseline performance with 0.514 NDCG@1 and 0.712 MRR@10. Designed a multi-stage BM25 → MiniLM-L12 → Top-20 → ELECTRA reranking pipeline, improving MRR@10 from 0.7111 to 0.7155 and NDCG@10 from 0.4072 to 0.4096.
