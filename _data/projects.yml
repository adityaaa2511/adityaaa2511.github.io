  image:
    src: /assets/img/project/Q-network.png
    alt: 
  date: October 2025
  description: Constructed Deep Q-Networks (DQN) with linear and non-linear Q-networks, experience replay, target networks, and ε-greedy exploration, evaluating generalization under distribution shift in a modified Cliff Walking environment. Implemented Deep SARSA with neural Q-function approximation and on-policy experience replay for Lunar Lander-v2, achieving a mean reward of 278.5 ± 19 over 100 evaluation episodes. Applied DQN to portfolio optimization, comparing final-wealth maximization against a risk-aware objective across 100 seeds; the risk-aware agent achieved 72.865 mean final wealth with 15.53 std., versus 65 with 16.8 std. for final-wealth maximization.
