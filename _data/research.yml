- title: Analysing Multiphase Flows using Graph Neural Networks
  image:
    src: /assets/img/research/SURA.jpg
    alt: 
  date: January - December 2024
  description: Developed a Graph Neural Network (GNN) framework to model spatiotemporal evolution of multiphase flows using CFD-generated simulation data. Designed and optimized GCN/GAT architectures with learned edge encoders, achieving 90%+ training accuracy for force-chain classification. Formulated multiphase-flow prediction as a spatiotemporal regression task using log-cosh loss, and evaluated the model’s ability to generalize across temporal steps and larger flow domains.
