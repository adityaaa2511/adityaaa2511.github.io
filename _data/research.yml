    alt: 
  date: July '24 - May '25
  description: Developed a high-precision legal advisory chatbot to provide accurate answers while addressing the issue of AI-generated inaccuracies, known as hallucinations. Used advanced techniques to improve factual reliability, including better information retrieval and response validation, ensuring credible and trustworthy outputs.
